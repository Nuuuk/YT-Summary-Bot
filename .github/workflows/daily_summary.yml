name: YouTube Auto Summary Daily

on:
  schedule:
    # 美东时间中午 12:17 (16:17 UTC) 和 晚上 21:27 (次日 01:27 UTC)
    - cron: '17 16 * * *'
    - cron: '27 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade yt-dlp google-genai markdown

      - name: Run Summary Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python summary_bot.py

      - name: Save Processed Videos State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_videos.json || true
          git commit -m "chore: update processed video history" || true
          git push || true
